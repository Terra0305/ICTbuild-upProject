# Production stack for the single EC2 host. deploy.sh writes .env next to this
# file (secrets from Secrets Manager + per-environment settings) before running
# `docker compose up`. Host paths under /data are created by the EC2 user-data.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: refind
      POSTGRES_DB: refind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Sized for a 2GB t3.small shared with the API and the sync job.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refind -d refind"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://refind:${POSTGRES_PASSWORD}@postgres:5432/refind
      FAISS_INDEX_DIR: /data/faiss
    depends_on:
      postgres:
        condition: service_healthy
    # CloudFront is the only client; the security group limits port 80 to it.
    ports:
      - "80:8000"
    volumes:
      - /data/faiss:/data/faiss
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
