# Single entry point on port 80 behind CloudFront (the security group only allows
# CloudFront on 80). /api/ and /health go to FastAPI, everything else to Next.js.
# /lost-items/* never reaches this host: CloudFront serves it from S3.

# Docker's embedded DNS; variables in proxy_pass force re-resolution so a
# recreated api/web container (new IP) is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    # Host is the EC2 origin name (CloudFront strips the viewer Host), so keep redirects relative.
    absolute_redirect off;

    # Backend accepts images up to 10 MiB (MAX_IMAGE_SIZE_BYTES); leave room for form fields.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
