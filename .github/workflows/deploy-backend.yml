name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Never run two deploys against the single EC2 host at once; queue instead.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/terra0305/refind-backend
  AWS_REGION: ap-northeast-2

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    # The deploy role trusts main only; don't let other branches overwrite :latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.sh on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          CORS_ORIGIN_REGEX: ${{ vars.CORS_ORIGIN_REGEX }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
          STORAGE_PUBLIC_BASE_URL: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy
          API_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail
          for name in INSTANCE_ID FRONTEND_URL STORAGE_BUCKET STORAGE_PUBLIC_BASE_URL; do
            [ -n "${!name}" ] || { echo "::error::Actions variable for $name is not set"; exit 1; }
          done

          # %q quoting keeps the regex's $ and backslashes intact on the host shell.
          deploy_cmd=$(printf 'FRONTEND_URL=%q CORS_ORIGIN_REGEX=%q STORAGE_BUCKET=%q STORAGE_PUBLIC_BASE_URL=%q ./deploy.sh %q' \
            "$FRONTEND_URL" "$CORS_ORIGIN_REGEX" "$STORAGE_BUCKET" "$STORAGE_PUBLIC_BASE_URL" "$API_IMAGE")
          params=$(jq -n --arg raw "$RAW_BASE" --arg deploy "$deploy_cmd" '{
            executionTimeout: ["1200"],
            commands: [
              "set -eu",
              "cd /opt/refind",
              "curl -fsSL \($raw)/docker-compose.prod.yml -o docker-compose.prod.yml",
              "curl -fsSL \($raw)/deploy.sh -o deploy.sh",
              "chmod 700 deploy.sh",
              $deploy
            ]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Final status: $status"
          [ "$status" = "Success" ]
