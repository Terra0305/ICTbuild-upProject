name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[ai,dev]"
      - name: Cache text-embedding model
        uses: actions/cache@v4
        with:
          path: backend/app/ai/models/text-embed
          key: text-embed-model-xenova-paraphrase-multilingual-minilm-l12-v2-quantized
      - name: Download text-embedding model
        run: |
          mkdir -p app/ai/models/text-embed
          [ -f app/ai/models/text-embed/tokenizer.json ] || curl -fL "https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json" -o app/ai/models/text-embed/tokenizer.json
          [ -f app/ai/models/text-embed/model_quantized.onnx ] || curl -fL "https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx" -o app/ai/models/text-embed/model_quantized.onnx
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
